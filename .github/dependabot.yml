version: 2

updates:
  # Composer dependencies (runtime + dev)
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - composer
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      # Bundle illuminate/* and related Laravel dev-tooling into one PR
      # so the package doesn't get flooded by per-package PRs.
      laravel:
        patterns:
          - "illuminate/*"
          - "laravel/*"
          - "larastan/*"
          - "orchestra/*"
          - "pestphp/*"
      phpstan:
        patterns:
          - "phpstan/*"

  # GitHub Actions versions (keeps setup-php, checkout, etc. current)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci(deps)
      include: scope
